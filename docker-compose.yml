version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: petmarketplace-postgres
    environment:
      POSTGRES_DB: petmarketplace
      POSTGRES_USER: petmarketplace
      POSTGRES_PASSWORD: petmarketplace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmarketplace -d petmarketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  redis:
    image: redis:7-alpine
    container_name: petmarketplace-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  minio:
    image: minio/minio:latest
    container_name: petmarketplace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: petmarketplace-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:

networks:
  petmarketplace-network:
    driver: bridge
