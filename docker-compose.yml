version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: petmarketplace-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petmarketplace}
      POSTGRES_USER: ${POSTGRES_USER:-petmarketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petmarketplace}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmarketplace -d petmarketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  redis:
    image: redis:7-alpine
    container_name: petmarketplace-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  minio:
    image: minio/minio:latest
    container_name: petmarketplace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: petmarketplace-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petmarketplace-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: petmarketplace-kafka
    environment:
      CLUSTER_ID: "a6H0HOoYSDivVZWtRvFS1A"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - petmarketplace-network

  app:
    build: .
    image: pet-marketplace:local
    container_name: petmarketplace-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-petmarketplace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-petmarketplace}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-petmarketplace}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-secure-random-string-of-at-least-256-bits}
      STORAGE_LOCAL_PATH: /app/uploads
    volumes:
      - app-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks:
      - petmarketplace-network

  caddy:
    image: caddy:2-alpine
    container_name: petmarketplace-caddy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - petmarketplace-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
  app-uploads:

networks:
  petmarketplace-network:
    driver: bridge
