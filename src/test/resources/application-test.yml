spring:
  application:
    name: pet-marketplace

  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: public

  data:
    redis:
      timeout: 2000ms
      connect-timeout: 2000ms
      database: 0

  mail:
    host: localhost
    port: 1025

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: 0
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret: test-secret-must-be-at-least-256-bits-long-for-hs256-signing-algorithm
    access-expiration-minutes: 60
    refresh-expiration-days: 1

storage:
  provider: local
  local:
    base-path: ./test-uploads

mail:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    com.petmarketplace: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
