databaseChangeLog:
  - logicalFilePath: db/changelog/changelogs/007-animal-import-jobs.yaml

  - changeSet:
      id: 007-create-table-animal-import-jobs
      author: liquibase
      changes:
        - createTable:
            tableName: animal_import_jobs
            remarks: Tracks Excel import jobs — source file, progress, and report location
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  remarks: PENDING, IN_PROGRESS, COMPLETED, FAILED
                  constraints:
                    nullable: false
              - column:
                  name: source_bucket
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: source_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: total_rows
                  type: BIGINT
              - column:
                  name: inserted_rows
                  type: BIGINT
              - column:
                  name: rejected_rows
                  type: BIGINT
              - column:
                  name: report_bucket
                  type: VARCHAR(255)
              - column:
                  name: report_key
                  type: VARCHAR(500)
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: started_at
                  type: TIMESTAMP
              - column:
                  name: finished_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
