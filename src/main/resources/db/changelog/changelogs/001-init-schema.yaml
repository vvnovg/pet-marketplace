            tableName: categories
            columns:
              - column: { name: id, value: '55555555-5555-5555-5555-555555555555' }
              - column: { name: name_ru, value: 'Рептилии' }
              - column: { name: name_en, value: 'Reptiles' }
              - column: { name: slug, value: 'reptiles' }
        - insert:
            tableName: categories
            columns:
              - column: { name: id, value: '66666666-6666-6666-6666-666666666666' }
              - column: { name: name_ru, value: 'Рыбы' }
              - column: { name: name_en, value: 'Fish' }
              - column: { name: slug, value: 'fish' }
        - insert:
            tableName: categories
            columns:
              - column: { name: id, value: '77777777-7777-7777-7777-777777777777' }
              - column: { name: name_ru, value: 'Другие' }
              - column: { name: name_en, value: 'Other' }
              - column: { name: slug, value: 'other' }

  - changeSet:
      id: 017-seed-breeds
      author: liquibase
