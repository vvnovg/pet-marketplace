        - insert:
            tableName: categories
            columns:
              - column: { name: id, value: '44444444-4444-4444-4444-444444444444' }
              - column: { name: name_ru, value: 'Грызуны' }
              - column: { name: name_en, value: 'Rodents' }
              - column: { name: slug, value: 'rodents' }
