<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Booking update</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
    <h2>Hello, <span th:text="${participantName}">User</span>!</h2>
    <p>A booking you are participating in has been updated.</p>
    <table style="border-collapse: collapse; width: 100%; max-width: 500px;">
        <tr>
            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Listing</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;" th:text="${booking.listing.title}">Title</td>
        </tr>
        <tr>
            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Your role</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;" th:text="${isBuyer} ? 'Buyer' : 'Seller'">Role</td>
        </tr>
        <tr>
            <td style="padding: 8px; border: 1px solid #ddd;"><strong>Other party</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;" th:text="${otherPartyName}">Other</td>
        </tr>
        <tr>
            <td style="padding: 8px; border: 1px solid #ddd;"><strong>New status</strong></td>
            <td style="padding: 8px; border: 1px solid #ddd;" th:text="${statusLabel}">Status</td>
        </tr>
    </table>
    <p>
        <a th:href="${bookingLink}" href="#"
           style="display: inline-block; padding: 12px 24px; background-color: #2196F3; color: #fff; text-decoration: none; border-radius: 4px;">
            View booking
        </a>
    </p>
    <p>If the button doesn't work, copy and paste this link into your browser:</p>
    <p><a th:href="${bookingLink}" th:text="${bookingLink}">booking link</a></p>
</body>
</html>
